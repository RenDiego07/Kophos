<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Kophos MVP - ASL Predictor</title>

  <!-- Librerías de MediaPipe para la interfaz visual -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      text-align: center;
      background-color: #f9f9f9;
    }

    /* Contenedor relativo para superponer el canvas sobre el video */
    .video-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto 20px auto;
    }

    video {
      width: 100%;
      border: 2px solid #333;
      border-radius: 12px;
      display: block;
      /* Efecto espejo para el usuario */
      transform: scaleX(-1); 
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      z-index: 10;
      /* Efecto espejo para que los puntos coincidan con el video */
      transform: scaleX(-1);
      pointer-events: none; 
    }

    button {
      padding: 12px 20px;
      margin: 8px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background-color: #222;
      color: white;
      transition: background-color 0.3s;
    }

    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }

    button:hover:not(:disabled) {
      background-color: #444;
    }

    #recordBtn {
      background-color: #d93025; /* Rojo para grabar */
    }

    #result {
      margin-top: 25px;
      padding: 15px;
      border-radius: 10px;
      background-color: #fff;
      border: 1px solid #ddd;
      text-align: left;
      white-space: pre-wrap;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>
  <h1>Kophos MVP - ASL Predictor</h1>

  <div class="video-container">
    <video id="preview" autoplay muted playsinline></video>
    <canvas id="output_canvas" width="640" height="480"></canvas>
  </div>

  <div>
    <button id="startBtn">Iniciar cámara</button>
    <button id="recordBtn" disabled>🔴 Grabar Seña</button>
    <button id="stopBtn" disabled>⏹ Detener y Predecir</button>
  </div>

  <div id="result">El sistema está en espera...</div>

  <script>
    const API_URL = "http://127.0.0.1:8000/predict/";

    const preview = document.getElementById("preview");
    const canvasElement = document.getElementById("output_canvas");
    const canvasCtx = canvasElement.getContext("2d");
    
    const startBtn = document.getElementById("startBtn");
    const recordBtn = document.getElementById("recordBtn");
    const stopBtn = document.getElementById("stopBtn");
    const resultDiv = document.getElementById("result");

    let stream;
    let mediaRecorder;
    let recordedChunks = [];
    let isDrawing = false;

    // --- CONFIGURACIÓN DE MEDIAPIPE VISUAL ---
    const holistic = new Holistic({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`;
    }});
    
    holistic.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    holistic.onResults((results) => {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      // Dibujar Postura (Cuerpo)
      if (results.poseLandmarks) {
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
        drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF0000', lineWidth: 1});
      }
      // Dibujar Mano Izquierda
      if (results.leftHandLandmarks) {
        drawConnectors(canvasCtx, results.leftHandLandmarks, HAND_CONNECTIONS, {color: '#CC0000', lineWidth: 3});
        drawLandmarks(canvasCtx, results.leftHandLandmarks, {color: '#00FF00', lineWidth: 2});
      }
      // Dibujar Mano Derecha
      if (results.rightHandLandmarks) {
        drawConnectors(canvasCtx, results.rightHandLandmarks, HAND_CONNECTIONS, {color: '#00CC00', lineWidth: 3});
        drawLandmarks(canvasCtx, results.rightHandLandmarks, {color: '#FF0000', lineWidth: 2});
      }
      canvasCtx.restore();
    });

    // Bucle para alimentar frames al MediaPipe visual
    async function detectionLoop() {
      if (isDrawing && preview.videoWidth) {
        // Sincronizar tamaño del canvas con el video
        canvasElement.width = preview.videoWidth;
        canvasElement.height = preview.videoHeight;
        await holistic.send({image: preview});
      }
      if (isDrawing) {
        requestAnimationFrame(detectionLoop);
      }
    }
    // -----------------------------------------

    startBtn.onclick = async () => {
      try {
        resultDiv.textContent = "Cargando modelo visual... Por favor espera.";
        
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 },
          audio: false
        });

        preview.srcObject = stream;

        // Iniciar el dibujado en vivo
        preview.onloadedmetadata = () => {
            isDrawing = true;
            detectionLoop();
        };

        recordBtn.disabled = false;
        startBtn.disabled = true;
        resultDiv.textContent = "✅ Cámara y esqueleto iniciados. Puedes grabar.";
      } catch (error) {
        resultDiv.textContent = "Error al acceder a la cámara: " + error.message;
      }
    };

    recordBtn.onclick = () => {
      recordedChunks = [];

      mediaRecorder = new MediaRecorder(stream, {
        mimeType: "video/webm"
      });

      mediaRecorder.ondataavailable = event => {
        if (event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = async () => {
        const blob = new Blob(recordedChunks, {
          type: "video/webm"
        });

        await sendVideoToAPI(blob);
      };

      mediaRecorder.start();

      recordBtn.disabled = true;
      stopBtn.disabled = false;

      resultDiv.textContent = "🔴 Grabando seña...";
    };

    stopBtn.onclick = () => {
      mediaRecorder.stop();

      stopBtn.disabled = true;
      recordBtn.disabled = false;

      resultDiv.textContent = "⏳ Enviando a la API y procesando...";
    };

    async function sendVideoToAPI(videoBlob) {
      const formData = new FormData();
      formData.append("video", videoBlob, "recording.webm");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          resultDiv.textContent = "Error del Servidor:\n" + JSON.stringify(data, null, 2);
          return;
        }

        resultDiv.textContent =
          "Traducción Exitosa 🎯\n\n" +
          "Palabra: " + data.prediction + "\n" +
          "Confianza: " + data.confidence + "%\n" +
          "Frames Analizados: " + data.total_frames_processed + "\n\n" +
          "Distribución BiLSTM:\n" +
          JSON.stringify(data.raw_probabilities, null, 2);

      } catch (error) {
        resultDiv.textContent = "Error de red al enviar el video: " + error.message;
      }
    }
  </script>
</body>
</html>
